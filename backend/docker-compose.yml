services:
  postgres:
    image: postgres:17-alpine
    container_name: financepilot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financepilot}
      POSTGRES_USER: ${POSTGRES_USER:-financepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financepilot_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - financepilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financepilot} -d ${POSTGRES_DB:-financepilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financepilot-api
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  financepilot_postgres_data:
