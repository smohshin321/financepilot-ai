name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Quality and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: financepilot_test
          POSTGRES_USER: financepilot
          POSTGRES_PASSWORD: financepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financepilot -d financepilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: FinancePilot AI
      APP_VERSION: 0.2.0
      APP_ENV: test
      DEBUG: "false"
      LOG_LEVEL: INFO
      API_PREFIX: /api/v1
      CORS_ORIGINS: '["http://localhost:3000"]'
      DATABASE_URL: postgresql+psycopg://financepilot:financepilot@localhost:5432/financepilot_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff linting
        run: ruff check app tests

      - name: Verify Ruff formatting
        run: ruff format --check app tests

      - name: Run mypy
        run: mypy app

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
